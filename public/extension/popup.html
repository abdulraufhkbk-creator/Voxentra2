<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Voxentra Quick Intel</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      margin: 0;
      padding: 16px;
      width: 320px;
      background: #0f172a;
      color: #f8fafc;
      box-sizing: border-box;
    }
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid #1e293b;
      padding-bottom: 12px;
      margin-bottom: 12px;
    }
    .logo {
      font-size: 16px;
      font-weight: 800;
      letter-spacing: -0.02em;
      color: #38bdf8;
    }
    .badge {
      font-size: 10px;
      color: #94a3b8;
      background: #1e293b;
      padding: 2px 6px;
      border-radius: 4px;
    }
    .content-box {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 8px;
      padding: 12px;
      font-size: 12px;
      margin-bottom: 14px;
    }
    .btn {
      width: 100%;
      background: #2563eb;
      color: #ffffff;
      border: none;
      padding: 10px 14px;
      border-radius: 6px;
      font-weight: 600;
      font-size: 13px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }
    .btn:hover {
      background: #1d4ed8;
    }
    .result-section {
      display: none;
      margin-top: 12px;
      padding: 12px;
      background: #020617;
      border-radius: 6px;
      border: 1px solid #1e293b;
    }
    .risk-badge {
      display: inline-block;
      font-size: 11px;
      font-weight: 700;
      padding: 2px 8px;
      border-radius: 4px;
      margin-bottom: 8px;
    }
    .risk-HIGH { background: #ef4444; color: #fff; }
    .risk-CAUTION { background: #f59e0b; color: #000; }
    .risk-LOW { background: #10b981; color: #fff; }
    .open-full-btn {
      margin-top: 10px;
      display: block;
      text-align: center;
      color: #38bdf8;
      text-decoration: none;
      font-size: 12px;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="logo">VOXENTRA</div>
    <span class="badge">Companion v1.0</span>
  </div>

  <div class="content-box">
    <div id="page-status" style="color: #94a3b8;">Scanning active social page...</div>
    <div id="post-snippet" style="margin-top: 6px; color: #cbd5e1; font-style: italic;">No text detected yet.</div>
  </div>

  <button id="analyze-btn" class="btn">
    <span id="btn-text">Analyze This</span>
  </button>

  <div id="result-section" class="result-section">
    <div id="risk-pill" class="risk-badge">RISK: CAUTION</div>
    <div id="summary-text" style="font-size: 11px; line-height: 1.4; color: #cbd5e1;"></div>
    <a id="open-full-link" href="#" target="_blank" class="open-full-btn">Open Full Analysis &rarr;</a>
  </div>

  <script src="popup.js"></script>
</body>
</html>
